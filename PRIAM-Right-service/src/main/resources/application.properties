server.port=8083
spring.application.name=RIGHT-SERVICE
spring.datasource.url=jdbc:mysql://localhost:3306/priam-right?useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.database=MYSQL

spring.cloud.discovery.enabled=true
feign.client.config.default.connectTimeout=160000000
feign.client.config.default.readTimeout=160000000

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka/
custom.data.url=${CUSTOM_DATA_URL:http://localhost:8081}
#Prometheus
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://jaeger:4317
otel.exporter.otlp.protocol=grpc
otel.service.name=PRIAM-Right-Service