  mysqldb:
    #image: priam/databases
    image: registry.gitlab.com/priam3/priam-microservice/databases
    container_name: priam-databases
    networks:
      - ms-to-db-server
    env_file:
      - ".env" # Secrets
    ports:
      - 3308:3306  #- 3307:3306
    volumes:
      #- ./Databases/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./db-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "mysqldb"]
      retries: 20
      interval: 3s
      timeout: 60s
    pull_policy: always

