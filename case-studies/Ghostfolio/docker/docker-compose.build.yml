name: ghostfolio_build
services:
  ghostfolio:
    build: ../
    image: ghostfolio/ghostfolio:local
    extends:
      file: docker-compose.yml
      service: ghostfolio

  postgres:
    container_name: gf-postgres-build
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    container_name: gf-redis-build
    extends:
      file: docker-compose.yml
      service: redis

volumes:
  postgres:

# extends (above) only merges service-level fields - top-level networks:
# must be redeclared in this file too for the common_network reference to
# resolve (same reason volumes: is redeclared above).
networks:
  default:
  common_network:
    external: true
