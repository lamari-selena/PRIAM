services:
  client:
    build:
      context: .
      dockerfile: ./Dockerfile-Dev
    command: ["npm", "run", "client:dev:docker"]
    depends_on:
      - server
    environment:
      - BASE_URL=http://server:3000
      # vite.config.mjs reads this at dev-server start to bake the "Manage on
      # PRIAM" link/consent redirect target into the client bundle (§4ter).
      - PRIAM_FRONTEND_URL=http://localhost:4200
    networks:
      - habitica
    ports:
      - "5173:5173"
    volumes:
      - .:/usr/src/habitica
      - /usr/src/habitica/node_modules
      - /usr/src/habitica/website/client/node_modules
  server:
    build:
      context: .
      dockerfile: ./Dockerfile-Dev
    command: ["npm", "start"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_DB_URI=mongodb://mongo/habitrpg
      # PRIAM integration (Docs/PRIAM-INTEGRATION-PLAYBOOK.md §4/§4bis/§5).
      # Reachable over common_network, real service names/ports from the
      # PRIAM root docker-compose.yml. Empty = disabled/fail-open.
      - PRIAM_CDP_URL=http://consent:8089
      - PRIAM_ACTOR_URL=http://actor:8082
      - PRIAM_DATA_URL=http://data:8081
      - PRIAM_FRONTEND_URL=http://localhost:4200
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080
      - KEYCLOAK_REALM=priam-realm
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    networks:
      - habitica
      - common_network
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/habitica
      - /usr/src/habitica/node_modules
  mongo:
    image: "mongo:7.0"
    container_name: "habitica-mongodb"
    networks:
      - habitica
    hostname: "mongodb"
    ports:
      - "27017:27017"
    restart: "unless-stopped"
    volumes:
      - "./mongodb-data-docker:/data/db"
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all", "--replSet", "rs" ]
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 30s
      start_period: 0s
      retries: 30

networks:
  habitica:
    driver: bridge
  # Created/owned by PRIAM's own root docker-compose.yml (playbook §5) -
  # start that stack at least once before this one.
  common_network:
    external: true
