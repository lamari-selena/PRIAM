# Local-dev orchestration for OnlineBoutique, added for the PRIAM
# integration session (see priam-integration/INTEGRATION-REPORT.md).
#
# Upstream OnlineBoutique ships NO docker-compose.yml - it targets a real
# GKE cluster via skaffold/kubernetes-manifests. This file reproduces the
# same services as plain containers, using the same env var contract as
# kubernetes-manifests/*.yaml (verified in those files, not invented), so
# that PRIAM's own docker-compose stack can reach it over `common_network`
# (playbook §5) without requiring a Kubernetes cluster.
#
# shoppingassistantservice/loadgenerator are intentionally NOT included:
# neither is reachable from any of the flows this integration exercises
# (frontend only dials shoppingassistantservice from /bot and /assistant,
# neither used by the PRIAM annotation; loadgenerator is a Locust traffic
# generator, not part of the app itself). frontend's
# SHOPPING_ASSISTANT_SERVICE_ADDR below is set to a non-resolvable
# placeholder - mustMapEnv only requires it to be non-empty at startup, the
# service itself is never dialed unless /bot is called.
#
# redis-cart is still required (cartservice/checkoutservice still need it
# for the ordinary shopping cart flow - PRIAM no longer annotates Cart data
# in this integration, see Databases/db_insertion_script.sql's header
# comment for why account/order data is the more interesting durable target
# now that the application has real accounts).
name: onlineboutique
services:
  redis-cart:
    image: redis:7-alpine
    container_name: ob-redis-cart
    networks:
      - ob_internal

  cartservice:
    build:
      context: ./src/cartservice/src
    container_name: ob-cartservice
    environment:
      REDIS_ADDR: redis-cart:6379
    depends_on:
      - redis-cart
    networks:
      - ob_internal

  productcatalogservice:
    build:
      context: ./src/productcatalogservice
    container_name: ob-productcatalogservice
    environment:
      PORT: "3550"
      DISABLE_PROFILER: "1"
    networks:
      - ob_internal

  currencyservice:
    build:
      context: ./src/currencyservice
    container_name: ob-currencyservice
    environment:
      PORT: "7000"
      DISABLE_PROFILER: "1"
    networks:
      - ob_internal

  shippingservice:
    build:
      context: ./src/shippingservice
    container_name: ob-shippingservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
      DISABLE_TRACING: "1"
    networks:
      - ob_internal

  emailservice:
    build:
      context: ./src/emailservice
    container_name: ob-emailservice
    environment:
      PORT: "8080"
      DISABLE_PROFILER: "1"
    networks:
      - ob_internal

  paymentservice:
    build:
      context: ./src/paymentservice
    container_name: ob-paymentservice
    environment:
      PORT: "50051"
      DISABLE_PROFILER: "1"
    networks:
      - ob_internal

  recommendationservice:
    build:
      context: ./src/recommendationservice
    container_name: ob-recommendationservice
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      DISABLE_PROFILER: "1"
    depends_on:
      - productcatalogservice
    networks:
      - ob_internal

  adservice:
    build:
      context: ./src/adservice
    container_name: ob-adservice
    environment:
      PORT: "9555"
    networks:
      - ob_internal

  checkoutservice:
    build:
      context: ./src/checkoutservice
    container_name: ob-checkoutservice
    environment:
      PORT: "5050"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      PAYMENT_SERVICE_ADDR: paymentservice:50051
      EMAIL_SERVICE_ADDR: emailservice:8080
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
    depends_on:
      - productcatalogservice
      - shippingservice
      - paymentservice
      - emailservice
      - currencyservice
      - cartservice
    networks:
      - ob_internal

  frontend:
    build:
      context: ./src/frontend
    container_name: ob-frontend
    environment:
      PORT: "8080"
      PRODUCT_CATALOG_SERVICE_ADDR: productcatalogservice:3550
      CURRENCY_SERVICE_ADDR: currencyservice:7000
      CART_SERVICE_ADDR: cartservice:7070
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:8080
      SHIPPING_SERVICE_ADDR: shippingservice:50051
      CHECKOUT_SERVICE_ADDR: checkoutservice:5050
      AD_SERVICE_ADDR: adservice:9555
      # Not deployed in this stack (see header comment) - never dialed
      # unless /bot is called.
      SHOPPING_ASSISTANT_SERVICE_ADDR: shoppingassistantservice:80
      ENV_PLATFORM: local
      # Durable account/order store (accounts_handlers.go/store.go) - see
      # "changes for data persistence.md". Points inside the volume mounted
      # below so the SQLite file survives container recreation, unlike the
      # image's default /src/onlineboutique.db (which would live only in
      # the container's writable layer).
      ACCOUNT_DB_PATH: /data/onlineboutique.db
      # PRIAM wiring (playbook §4/§4bis/§4ter).
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_DATA_URL: http://data:8081
      PRIAM_FRONTEND_URL: http://localhost:4200
      # Automatic Keycloak provisioning at sign-up (playbook §4bis). Reuses
      # PRIAM root docker-compose.yml's `keycloak` service admin bootstrap
      # (KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD, both "admin") - fine for
      # dev/test per that section's own documented tradeoff; a dedicated
      # manage-users client is preferable before any real exposure.
      # keycloak:8080 is the Docker-internal address on common_network, not
      # the host-mapped localhost:8080 a browser uses.
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: priam-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - productcatalogservice
      - currencyservice
      - cartservice
      - recommendationservice
      - shippingservice
      - checkoutservice
      - adservice
    ports:
      # Host port 9090, not 8080: PRIAM's own docker-compose.yml fixes
      # Keycloak on host port 8080 (shared/generic across every case
      # study, playbook §0 - not something this integration should change)
      # - OnlineBoutique's natural default of 8080 collides with it on the
      # same Docker host, and 8081 is also already taken by PRIAM-Data-
      # service. The container's own internal port (8080) is unaffected -
      # CUSTOM_PROVIDER_URL (root .env) reaches this service over
      # common_network by its Docker-internal service name/port
      # (http://frontend:8080), not through this host mapping.
      - "9090:8080"
    volumes:
      # Bind mount (not a named volume) so the one-off backfill script
      # (priam-integration/backfill-data-subjects.sh) can read the same
      # SQLite file directly from the host with a plain, throwaway
      # container - same rationale as PRIAM's own ./db-volume.
      - ../../onlineboutique-db-volume:/data
    networks:
      - ob_internal
      - common_network

networks:
  ob_internal:
  # Owned by PRIAM's own root docker-compose.yml / created once with
  # `docker network create common_network` (playbook §5) - must already
  # exist before this stack starts.
  common_network:
    external: true
