{{ define "signup" }}
    {{ template "header" . }}

    <div {{ with $.platform_css }} class="{{.}}" {{ end }}>
        <span class="platform-flag">
            {{$.platform_name}}
        </span>
    </div>

    <main role="main" class="cart-sections">
        <section class="container">
            <div class="row">
                <div class="col-lg-5 offset-lg-3">

                    <div class="row">
                        <div class="col">
                            <h3>Create an account</h3>
                        </div>
                    </div>

                    <form class="cart-checkout-form" action="{{ $.baseUrl }}/accounts/signup" method="POST">

                        <div class="form-row">
                            <div class="col cymbal-form-field">
                                <label for="email">E-mail Address</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col cymbal-form-field">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" minlength="8" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="col cymbal-form-field">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
                            </div>
                        </div>

                        <div class="form-row justify-content-center">
                            <div class="col text-center">
                                <button class="cymbal-button-primary" type="submit">
                                    Sign Up
                                </button>
                            </div>
                        </div>

                        <div class="form-row justify-content-center">
                            <div class="col text-center">
                                Already have an account? <a href="{{ $.baseUrl }}/accounts/login">Log in</a>
                            </div>
                        </div>

                    </form>

                </div>
            </div>
        </section>
    </main>

    {{ template "footer" . }}
{{ end }}
