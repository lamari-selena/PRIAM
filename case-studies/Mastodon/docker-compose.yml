# This file is designed for production server deployment, not local development work
# For a containerized local dev environment, see: https://github.com/mastodon/mastodon/blob/main/docs/DEVELOPMENT.md#docker

services:
  db:
    restart: always
    image: postgres:14-alpine
    shm_size: 256mb
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
    volumes:
      - ./postgres14:/var/lib/postgresql/data
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'

  redis:
    restart: always
    image: redis:7-alpine
    networks:
      - internal_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./redis:/data

  # es:
  #   restart: always
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
  #   environment:
  #     - "ELASTIC_PASSWORD=password"  #Username is elastic. Do not change the username.
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m -Des.enforce.bootstrap.checks=true"
  #     - "xpack.license.self_generated.type=basic"
  #     - "xpack.security.enabled=false"
  #     - "xpack.watcher.enabled=false"
  #     - "xpack.graph.enabled=false"
  #     - "xpack.ml.enabled=false"
  #     - "bootstrap.memory_lock=true"
  #     - "cluster.name=es-mastodon"
  #     - "discovery.type=single-node"
  #     - "thread_pool.write.queue_size=1000"
  #   networks:
  #      - external_network
  #      - internal_network
  #   healthcheck:
  #      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
  #   volumes:
  #      - ./elasticsearch:/usr/share/elasticsearch/data
  #   ulimits:
  #     memlock:
  #       soft: -1
  #       hard: -1
  #     nofile:
  #       soft: 65536
  #       hard: 65536
  #   ports:
  #     - '127.0.0.1:9200:9200'

  web:
    # Building from local source (not the prebuilt image) so the PRIAM
    # Provider bridge / registration hooks actually run - playbook §7/§8.9
    # ("the service must build from local source", a stale prebuilt image
    # produces exactly the same symptoms as a real bug: 200 OK, no effect).
    build: .
    restart: always
    env_file: .env.production
    environment:
      # PRIAM integration (Docs/PRIAM-INTEGRATION-PLAYBOOK.md §4/§4bis/§5).
      # Reachable over common_network, real service names/ports from the
      # PRIAM root docker-compose.yml. Empty = disabled/fail-open.
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_DATA_URL: http://data:8081
      PRIAM_FRONTEND_URL: http://localhost:4200
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: priam-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: bundle exec puma -C config/puma.rb
    networks:
      - external_network
      - internal_network
      - common_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL',"curl -s --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - db
      - redis
      # - es
    volumes:
      - ./public/system:/mastodon/public/system

  streaming:
    # You can uncomment the following lines if you want to not use the prebuilt image, for example if you have local code changes
    # build:
    #   dockerfile: ./streaming/Dockerfile
    #   context: .
    image: ghcr.io/mastodon/mastodon-streaming:v4.6.3
    restart: always
    env_file: .env.production
    command: node ./streaming/index.js
    networks:
      - external_network
      - internal_network
    healthcheck:
      # prettier-ignore
      test: ['CMD-SHELL', "curl -s --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    ports:
      # Host port remapped to 4001 - PRIAM-Frontend-Provider already owns
      # host port 4000 (root docker-compose.yml) on this machine.
      - '127.0.0.1:4001:4000'
    depends_on:
      - db
      - redis

  sidekiq:
    # Same rationale as `web` above - PriamRegisterSubjectWorker
    # (app/workers/) runs inside this process.
    build: .
    restart: always
    env_file: .env.production
    environment:
      # Same PRIAM/Keycloak wiring as `web` above - the background worker
      # that calls register_data_subject/report_processed_data runs here.
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_DATA_URL: http://data:8081
      PRIAM_FRONTEND_URL: http://localhost:4200
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: priam-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: bundle exec sidekiq
    depends_on:
      - db
      - redis
    networks:
      - external_network
      - internal_network
      - common_network
    volumes:
      - ./public/system:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 8' || false"]

  ## Uncomment to enable federation with tor instances along with adding the following ENV variables
  ## http_hidden_proxy=http://privoxy:8118
  ## ALLOW_ACCESS_TO_HIDDEN_SERVICE=true
  # tor:
  #   image: sirboops/tor
  #   networks:
  #      - external_network
  #      - internal_network
  #
  # privoxy:
  #   image: sirboops/privoxy
  #   volumes:
  #     - ./priv-config:/opt/config
  #   networks:
  #     - external_network
  #     - internal_network

networks:
  external_network:
  internal_network:
    internal: true
  # Created/owned by PRIAM's own root docker-compose.yml (playbook §5) -
  # start that stack at least once before this one.
  common_network:
    external: true
