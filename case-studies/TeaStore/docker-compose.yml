name: teastore
services:
  registry:
    build:
      context: ./services/tools.descartes.teastore.registry
    environment:
      HOST_NAME: registry
    networks:
      - teastore_internal

  db:
    image: descartesresearch/teastore-db
    networks:
      - teastore_internal

  persistence:
    build:
      context: ./services/tools.descartes.teastore.persistence
    environment:
      HOST_NAME: persistence
      REGISTRY_HOST: registry
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      - registry
      - db
    networks:
      - teastore_internal

  auth:
    build:
      context: ./services/tools.descartes.teastore.auth
    environment:
      HOST_NAME: auth
      REGISTRY_HOST: registry
      # PRIAM registration/consent/bookkeeping (playbook §4bis) - the actual
      # user-creation point (POST /useractions/register) and order-creation
      # point (POST /useractions/placeorder) live in this service.
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_DATA_URL: http://data:8081
      # Automatic Keycloak provisioning at sign-up (playbook §4bis) - TeaStore
      # has its own local sign-up added by this integration, no OIDC/SSO of
      # its own - reuses the admin bootstrap credentials already defined for
      # PRIAM's own `keycloak` service (root docker-compose.yml).
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: priam-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    depends_on:
      - registry
      - persistence
    networks:
      - teastore_internal
      - common_network

  image:
    build:
      context: ./services/tools.descartes.teastore.image
    environment:
      HOST_NAME: image
      REGISTRY_HOST: registry
    depends_on:
      - registry
    networks:
      - teastore_internal

  recommender:
    build:
      context: ./services/tools.descartes.teastore.recommender
    environment:
      HOST_NAME: recommender
      REGISTRY_HOST: registry
    depends_on:
      - registry
      - persistence
    networks:
      - teastore_internal

  webui:
    build:
      context: ./services/tools.descartes.teastore.webui
    environment:
      HOST_NAME: webui
      REGISTRY_HOST: registry
      # CEP (playbook §4, CartServlet's OPTIONAL recommendation block) +
      # "Manage on PRIAM" round-trip link (playbook §4ter, ProfileServlet) +
      # forced-consent redirect after sign-up/login (playbook §4bis,
      # RegisterServlet/LoginActionServlet).
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_FRONTEND_URL: http://localhost:4200
    depends_on:
      - registry
      - persistence
      - auth
      - image
      - recommender
    ports:
      # 9100: this integration's TARGET_APP_URL (root .env) and the
      # CUSTOM_PROVIDER_URL host used by the Provider bridge tests
      # (PriamProviderServlet, mounted at /api/* under this same webui
      # context - see priam-integration/ETAPES-FAITES.md).
      - "9100:8080"
    networks:
      - teastore_internal
      - common_network

networks:
  teastore_internal:
  # Owned by PRIAM's own root docker-compose.yml / created once with
  # `docker network create common_network` (playbook §5) - must already
  # exist before this stack starts.
  common_network:
    external: true
