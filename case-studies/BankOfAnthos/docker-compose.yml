# Local-dev orchestration for Bank of Anthos, added for the PRIAM
# integration session (see priam-integration/INTEGRATION-REPORT.md).
#
# Upstream Bank of Anthos ships NO docker-compose.yml - it targets a real
# GKE cluster via skaffold/kustomize (docs/development.md). This file
# reproduces the same 7 services + 2 Postgres databases as plain containers,
# using the same env var contract as kubernetes-manifests/*.yaml and
# src/*/k8s/base/config.yaml (verified in those files, not invented), so
# that PRIAM's own docker-compose stack can reach it over `common_network`
# (playbook §5) without requiring a Kubernetes cluster.
#
# The 3 Java services (ledgerwriter, balancereader, transactionhistory) have
# no Dockerfile upstream either (built via Jib through skaffold) - built
# here via priam-integration/java-service.Dockerfile, a plain multi-stage
# Maven build, from the repo root context (root pom.xml is the multi-module
# reactor).
name: bankofanthos
services:
  accounts-db:
    build:
      context: ./src/accounts/accounts-db
    container_name: boa-accounts-db
    environment:
      POSTGRES_DB: accounts-db
      POSTGRES_USER: accounts-admin
      POSTGRES_PASSWORD: accounts-pwd
      LOCAL_ROUTING_NUM: "883745000"
      USE_DEMO_DATA: "True"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts-admin -d accounts-db"]
      interval: 3s
      timeout: 10s
      retries: 20
    networks:
      - boa_internal

  ledger-db:
    build:
      context: ./src/ledger/ledger-db
    container_name: boa-ledger-db
    environment:
      POSTGRES_DB: postgresdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      LOCAL_ROUTING_NUM: "883745000"
      USE_DEMO_DATA: "True"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgresdb"]
      interval: 3s
      timeout: 10s
      retries: 20
    networks:
      - boa_internal

  userservice:
    build:
      context: ./src/accounts/userservice
    container_name: boa-userservice
    environment:
      VERSION: local
      PORT: "8080"
      ENABLE_TRACING: "false"
      TOKEN_EXPIRY_SECONDS: "3600"
      PRIV_KEY_PATH: /tmp/.ssh/privatekey
      PUB_KEY_PATH: /tmp/.ssh/publickey
      LOG_LEVEL: info
      ACCOUNTS_DB_URI: postgresql://accounts-admin:accounts-pwd@accounts-db:5432/accounts-db
      # PRIAM wiring (playbook §4bis) - Provider bridge (§2) also lives in
      # this service, reachable bare-/api on this same container/port.
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_DATA_URL: http://data:8081
      # Automatic Keycloak provisioning at sign-up (playbook §4bis) - reuses
      # the admin bootstrap credentials already defined for PRIAM's own
      # `keycloak` service (root docker-compose.yml).
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: priam-realm
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key:/tmp/.ssh/privatekey:ro
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    depends_on:
      accounts-db:
        condition: service_healthy
    ports:
      # host-published only for ad hoc Provider-bridge smoke curls during
      # this integration session - the real test methodology (playbook §3)
      # goes through PRIAM-Right-service over common_network, not this port.
      - "9001:8080"
    networks:
      - boa_internal
      - common_network

  contacts:
    build:
      context: ./src/accounts/contacts
    container_name: boa-contacts
    environment:
      VERSION: local
      PORT: "8080"
      ENABLE_TRACING: "false"
      LOG_LEVEL: info
      LOCAL_ROUTING_NUM: "883745000"
      PUB_KEY_PATH: /tmp/.ssh/publickey
      ACCOUNTS_DB_URI: postgresql://accounts-admin:accounts-pwd@accounts-db:5432/accounts-db
      PRIAM_ACTOR_URL: http://actor:8082
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_DATA_URL: http://data:8081
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    depends_on:
      accounts-db:
        condition: service_healthy
    networks:
      - boa_internal
      - common_network

  ledgerwriter:
    build:
      context: .
      dockerfile: ./priam-integration/java-service.Dockerfile
      args:
        MODULE: src/ledger/ledgerwriter
    container_name: boa-ledgerwriter
    # LedgerWriterApplication.stackdriver()#resourceLabels() does
    # `HOSTNAME.substring(0, HOSTNAME.indexOf("-"))` unconditionally (even
    # with metrics export disabled - see ENABLE_METRICS below, checked only
    # inside enabled(), not resourceLabels()). Docker's default hostname (a
    # container-id hex string) has no "-", so indexOf returns -1 and the
    # substring call throws, crashing on startup - a real bug outside a GKE
    # pod hostname, not a PRIAM-introduced issue. Fixed here (compose-only,
    # no source change) rather than patching the Java code.
    hostname: boa-ledgerwriter
    environment:
      PORT: "8080"
      LOCAL_ROUTING_NUM: "883745000"
      BALANCES_API_ADDR: balancereader:8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      PUB_KEY_PATH: /tmp/.ssh/publickey
      ENABLE_TRACING: "false"
      VERSION: local
      JVM_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    depends_on:
      ledger-db:
        condition: service_healthy
    networks:
      - boa_internal

  balancereader:
    build:
      context: .
      dockerfile: ./priam-integration/java-service.Dockerfile
      args:
        MODULE: src/ledger/balancereader
    container_name: boa-balancereader
    # See the "hostname" comment on ledgerwriter above - same fix needed here.
    hostname: boa-balancereader
    environment:
      PORT: "8080"
      LOCAL_ROUTING_NUM: "883745000"
      POLL_MS: "100"
      CACHE_SIZE: "1000000"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      PUB_KEY_PATH: /tmp/.ssh/publickey
      ENABLE_TRACING: "false"
      VERSION: local
      JVM_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    depends_on:
      ledger-db:
        condition: service_healthy
    networks:
      - boa_internal

  transactionhistory:
    build:
      context: .
      dockerfile: ./priam-integration/java-service.Dockerfile
      args:
        MODULE: src/ledger/transactionhistory
    container_name: boa-transactionhistory
    # See the "hostname" comment on ledgerwriter above - same fix needed here.
    hostname: boa-transactionhistory
    environment:
      PORT: "8080"
      LOCAL_ROUTING_NUM: "883745000"
      POLL_MS: "100"
      CACHE_SIZE: "1000"
      CACHE_MINUTES: "60"
      HISTORY_LIMIT: "100"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ledger-db:5432/postgresdb
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      PUB_KEY_PATH: /tmp/.ssh/publickey
      ENABLE_TRACING: "false"
      VERSION: local
      JVM_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    depends_on:
      ledger-db:
        condition: service_healthy
    networks:
      - boa_internal

  frontend:
    build:
      context: ./src/frontend
    container_name: boa-frontend
    environment:
      PORT: "8080"
      ENABLE_TRACING: "false"
      SCHEME: http
      LOG_LEVEL: info
      DEFAULT_USERNAME: testuser
      DEFAULT_PASSWORD: bankofanthos
      TRANSACTIONS_API_ADDR: ledgerwriter:8080
      USERSERVICE_API_ADDR: userservice:8080
      BALANCES_API_ADDR: balancereader:8080
      HISTORY_API_ADDR: transactionhistory:8080
      CONTACTS_API_ADDR: contacts:8080
      PUB_KEY_PATH: /tmp/.ssh/publickey
      LOCAL_ROUTING_NUM: "883745000"
      # PRIAM wiring (playbook §4bis): has_pending_consent_decision() at the
      # "current user" home() route + the client-side redirect to PRIAM's
      # consent page.
      PRIAM_CDP_URL: http://consent:8089
      PRIAM_FRONTEND_URL: http://localhost:4200
    volumes:
      - ./priam-integration/local-jwt/jwtRS256.key.pub:/tmp/.ssh/publickey:ro
    ports:
      - "9000:8080"
    depends_on:
      - userservice
      - contacts
      - ledgerwriter
      - balancereader
      - transactionhistory
    networks:
      - boa_internal
      - common_network

networks:
  boa_internal:
  # Owned by PRIAM's own root docker-compose.yml / created once with
  # `docker network create common_network` (playbook §5) - must already
  # exist before this stack starts.
  common_network:
    external: true
