global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'right-microservice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.17.0.1:8083']
      
  - job_name: 'actor-microservice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.17.0.1:8082']
      
  - job_name: 'data-microservice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.17.0.1:8081']
      
  - job_name: 'consent-microservice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['172.17.0.1:8089']
  
  - job_name: 'teastore'
    metrics_path: '/tools.descartes.teastore.webui/metrics'
    static_configs:
      - targets: ['172.17.0.1:8180']
      
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['172.17.0.1:8088']
