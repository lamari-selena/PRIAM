version: '3.7'

services:
  prometheus:
    #image: prom/prometheus
    image: registry.gitlab.com/priam3/monitoring/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitor-net

  grafana:
    #image: grafana/grafana
    image: registry.gitlab.com/priam3/monitoring/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - monitor-net

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitor-net

  jaeger:
    #image: jaegertracing/all-in-one:latest
    image: registry.gitlab.com/priam3/monitoring/jaeger-tracing
    container_name: jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - shared_net

volumes:
  grafana-storage:

networks:
  monitor-net:
  shared_net:
    name: common_network
