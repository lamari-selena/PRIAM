server.port=8089
spring.application.name=CONSENT-SERVICE
spring.datasource.url=jdbc:mysql://localhost:3306/priam-consent?useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.database=MYSQL
spring.cloud.discovery.enabled=true

eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka:8761}/eureka/
# Enable self-registration
eureka.client.register-with-eureka=true
# Enable fetching registry information
eureka.client.fetch-registry=true

feign.client.config.default.connectTimeout= 160000000
feign.client.config.default.readTimeout= 160000000

#Prometheus
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true


otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${JAEGER_ENDPOINT:http://jaeger:4317}
otel.exporter.otlp.protocol=grpc
otel.service.name=PRIAM-Consent-Service




