custom:
  # CORS: the browser origin(s) PRIAM-Frontend is served from. Comma-separated
  # for multiple. See SecurityConfig.java — @CrossOrigin on GatewayApplication
  # never applied to proxied routes, this is the real mechanism.
  frontend-origins: ${CUSTOM_FRONTEND_ORIGINS:http://localhost:4200}

spring:

  application:
    name: gateway


  security:
    oauth2:
      # Resource server: validates JWTs on human-facing routes (/right/**,
      # /cdp/**). Provider-agnostic — any OIDC-compliant issuer works. Blank
      # by default (SecurityConfig.java then fails OPEN with a warning, so
      # local machine-to-machine testing keeps working without an IdP). See
      # Docs/PRIAM-AUTH-OIDC.md.
      resourceserver:
        jwt:
          issuer-uri: ${CUSTOM_OIDC_ISSUER_URI:}
          # Only needed when the Gateway can't reach issuer-uri directly
          # (e.g. Docker Compose split view — see SecurityConfig.java).
          jwk-set-uri: ${CUSTOM_OIDC_JWK_SET_URI:}

  # OAuth2 client (login flow) is a PRIAM-Frontend concern, not the Gateway's
  # — the Gateway only ever validates tokens already obtained elsewhere,
  # never initiates a browser login redirect itself. Left here as reference
  # for whichever component ends up owning that flow.
  #   oauth2:
  #     client:
  #       registration:
  #         keycloak:
  #           client-id: gateway-client
  #           client-secret: your-client-secret
  #           provider: keycloak
  #           authorization-grant-type: authorization_code
  #           redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  #           scope: openid,profile,email
  #       provider:
  #         keycloak:
  #           issuer-uri: http://localhost:8080/realms/your-realm
  #           user-name-attribute: preferred_username

  cloud:
    gateway:
      default-filters: []
        #- TokenRelay
      routes:
        - id: data
          uri: http://localhost:8081
          predicates:
            - Path=/data/**
        - id: actor
          uri: http://localhost:8082
          predicates:
            - Path=/actor/**
        - id: right
          uri: http://localhost:8083
          predicates:
            - Path=/right/**
        - id: consent
          uri: http://localhost:8089
          predicates:
            - Path=/consent/**
        # etc.


otel:
  traces:
    exporter: otlp
  exporter:
    otlp:
      endpoint: ${JAEGER_ENDPOINT:http://jaeger:4317}
      protocol: grpc
  service:
    name: PRIAM-gateway-Service

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761}/eureka/
  instance:
    preferIpAddress: true

server:
  port: 8090
r2dbc:
    url: r2dbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.boot.actuate: DEBUG
    org.springframework.security.oauth2: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateways,routes