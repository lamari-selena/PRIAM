<h1>My Requests</h1>

<button mat-flat-button color="primary" (click)="refresh()" [disabled]="loading">Refresh</button>

<p *ngIf="loading">Loading...</p>
<p *ngIf="!loading && rows.length === 0">You have no pending or past requests.</p>

<table mat-table [dataSource]="rows" *ngIf="!loading && rows.length > 0">
  <ng-container matColumnDef="requestType">
    <th mat-header-cell *matHeaderCellDef>Type</th>
    <td mat-cell *matCellDef="let row">{{row.requestType}}</td>
  </ng-container>

  <ng-container matColumnDef="dataRequestClaim">
    <th mat-header-cell *matHeaderCellDef>Claim</th>
    <td mat-cell *matCellDef="let row">{{row.dataRequestClaim}}</td>
  </ng-container>

  <ng-container matColumnDef="newValue">
    <th mat-header-cell *matHeaderCellDef>New value</th>
    <td mat-cell *matCellDef="let row">{{row.newValue || '-'}}</td>
  </ng-container>

  <ng-container matColumnDef="answerStatus">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">{{row.answerStatus}}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
