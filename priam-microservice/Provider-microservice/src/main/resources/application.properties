server.port=8086
spring.application.name=PROVIDER-SERVICE
spring.datasource.url=jdbc:mysql://db:3306/teadb?useSSL=false
spring.datasource.username=${TEADB_USERNAME}
spring.datasource.password=${TEADB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.database=MYSQL

spring.cloud.discovery.enabled=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka/

feign.client.config.default.connectTimeout=160000000
feign.client.config.default.readTimeout=160000000

otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${JAEGER_ENDPOINT:http://jaeger:4317}
otel.exporter.otlp.protocol=grpc
otel.service.name=PRIAM-Provider-Service




