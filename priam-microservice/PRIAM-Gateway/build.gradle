plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.1.3'
}

group = 'priam.gateway'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2022.0.4")
}

dependencies {
    // CORE GATEWAY DEPENDENCIES WITH SECURITY EXCLUDED
    implementation('org.springframework.cloud:spring-cloud-starter-gateway') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
        exclude group: 'org.springframework.security', module: 'spring-security-config'
        exclude group: 'org.springframework.security', module: 'spring-security-web'
        exclude group: 'org.springframework.security', module: 'spring-security-core'
    }
    
    implementation('org.springframework.boot:spring-boot-starter-webflux') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
    }
    
    implementation('org.springframework.boot:spring-boot-starter-actuator') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
    }
    
    // SERVICE DISCOVERY
    implementation('org.springframework.cloud:spring-cloud-starter-netflix-eureka-client') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
    }
    
    // CIRCUIT BREAKER
    implementation('org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
    }
    
    // MONITORING
    implementation 'io.opentelemetry:opentelemetry-exporter-jaeger:1.34.1'
    
    // TESTING
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-security'
    }
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
